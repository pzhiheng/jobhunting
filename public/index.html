<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ——— Application-ledger design tokens ——— */
    :root {
      --paper:#EEF0E9;      /* cool bond paper */
      --card:#FBFBF7;       /* raised sheet */
      --ink:#242A31;        /* iron-gall ink */
      --muted:#6A727C;
      --rule:#D5D8CC;
      --rule-soft:#E4E6DC;
      --blue:#2B4EA2;       /* form ink blue */
      --blue-deep:#24418A;
      --red:#A03A2C;        /* stamp red */
      --green:#2C6B4E;      /* stamp green */
      --amber:#8F6B1C;
      --teal:#20606A;
      --sans:'Libre Franklin', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.55 var(--sans); color:var(--ink); background:var(--paper); }
    :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    a { color:var(--blue); text-decoration:none; } a:hover { text-decoration:underline; }
    .muted { color:var(--muted); }
    .label { font:600 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.16em; color:var(--muted); margin-bottom:10px; }

    /* ——— Masthead ——— */
    header { padding:20px 28px 12px; }
    .mast { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
    .eyebrow { font:500 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.18em; color:var(--muted); margin-bottom:7px; }
    h1 { margin:0; font:900 26px/1 var(--sans); text-transform:uppercase; letter-spacing:.02em; }
    .mastmeta { text-align:right; font:400 10.5px/1.7 var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
    #summary { margin-top:12px; padding-top:8px; border-top:2px solid var(--ink); font:400 12px/1.5 var(--mono); color:var(--muted); }

    /* ——— Folder tabs ——— */
    nav { display:flex; gap:6px; padding:6px 28px 0; align-items:flex-end; border-bottom:1px solid var(--ink); flex-wrap:wrap; }
    nav button { font:600 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.11em; color:var(--muted);
      padding:10px 13px 9px; border:1px solid transparent; border-bottom:none; background:none; cursor:pointer;
      border-radius:6px 6px 0 0; margin-bottom:-1px; }
    nav button:hover { color:var(--ink); }
    nav button.active { color:var(--ink); background:var(--card); border-color:var(--ink); }
    main { padding:22px 28px 48px; max-width:1280px; }

    /* ——— Ledger table ——— */
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--rule); }
    th { font:600 10px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.12em; color:var(--muted);
      text-align:left; padding:10px 12px; border-bottom:1px solid var(--ink); background:var(--card); }
    td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover td { background:#F2F3EA; }
    .posted { font-family:var(--mono); font-size:12px; white-space:nowrap; color:var(--muted); }
    .rel { font:600 12px var(--mono); }
    .blurb { font-size:12px; color:var(--muted); max-width:300px; margin-top:3px; }

    /* ——— Stamps ——— */
    .pill { display:inline-block; padding:2px 7px; border:1.5px solid currentColor; border-radius:3px; background:none;
      font:600 9.5px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.09em; }
    .suitable { color:var(--green); } .unsuitable { color:var(--red); } .unreviewed { color:var(--muted); }
    .ok, .broken, .expired, .repaired, .unchecked { font-family:var(--mono); font-size:11.5px; }
    .ok { color:var(--green); } .broken, .expired { color:var(--red); } .repaired { color:var(--amber); } .unchecked { color:var(--muted); }
    .pill.stage-applied, .pill.stage-confirmed { color:var(--blue); }
    .pill.stage-oa { color:var(--amber); }
    .pill.stage-interview { color:var(--teal); }
    .pill.stage-offer { color:var(--green); }
    .pill.stage-rejected { color:var(--red); }

    select { font:12px var(--mono); padding:4px 6px; border:1px solid var(--rule); border-radius:3px; background:var(--card); color:var(--ink); }
    .empty { padding:40px; text-align:center; color:var(--muted); background:var(--card); border:1px dashed var(--rule); }
    .panel { background:var(--card); border:1px solid var(--rule); padding:16px 18px; margin-bottom:18px; }
    .panel p { margin:6px 0 12px; } .panel .pill { margin:2px; }

    /* ——— Run tab: numbered pipeline ——— */
    .runhead { font:400 12px/1.7 var(--mono); color:var(--muted); margin-bottom:18px; max-width:72ch; }
    .cmdgroup { background:var(--card); border:1px solid var(--rule); padding:14px 18px 4px; margin-bottom:18px; }
    .cmd { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--rule-soft); flex-wrap:wrap; }
    .cmd:last-child { border-bottom:0; }
    .step { font:500 10px var(--mono); color:var(--muted); width:20px; flex:none; letter-spacing:.05em; }
    .cmd button { font:600 12.5px var(--sans); min-width:158px; text-align:left; padding:7px 12px;
      border:1px solid var(--rule); background:#fff; color:var(--ink); cursor:pointer; border-radius:3px; }
    .cmd button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
    .cmd button:active:not(:disabled) { transform:translateY(1px); }
    .cmd button:disabled { opacity:.45; cursor:default; }
    .cmddesc { flex:1; min-width:240px; font-size:12.5px; color:var(--muted); }
    .cmd input { font:12.5px var(--sans); padding:7px 10px; border:1px solid var(--rule); border-radius:3px; width:220px; background:#fff; }
    .log { background:#22262C; color:#D8DCD3; padding:16px 18px; max-height:420px; overflow:auto;
      font:11.5px/1.6 var(--mono); white-space:pre-wrap; word-break:break-word; border:1px solid var(--ink); }
    .log .badge { font-weight:600; }
    .log .badge.ok { color:#72C795; } .log .badge.fail { color:#E07863; }
    .log .muted { color:#9AA29B; }

    /* ——— Applied dossiers ——— */
    .apps { display:flex; flex-direction:column; gap:14px; }
    .appcard { border:1px solid var(--rule); padding:14px 18px; background:var(--card); }
    .apphead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .apphead .pill { font-size:11px; padding:4px 10px; border-width:2px; border-radius:4px; transform:rotate(-2deg); flex:none; margin-top:2px; }
    .timeline { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:12px 0 10px; }
    .timeline .ev { font:500 10px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.06em;
      padding:5px 9px; border:1px solid var(--rule); background:none; }
    .timeline .ev .muted { text-transform:none; letter-spacing:0; }
    .timeline .arrow { color:var(--muted); }
    .approw { display:flex; align-items:center; gap:8px; font-size:12.5px; }

    /* ——— File an application ——— */
    .addapp { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end; margin-bottom:18px;
      background:var(--card); border:1px solid var(--rule); padding:14px 18px; }
    .addapp .label { flex-basis:100%; margin-bottom:2px; }
    .addapp input { font:13px var(--sans); padding:7px 2px; border:0; border-bottom:1px solid var(--rule); border-radius:0; background:none; color:var(--ink); }
    .addapp input:focus { outline:none; border-bottom-color:var(--blue); }
    .addapp input[name=title] { flex:1; min-width:150px; }
    .addapp button { font:600 11px var(--mono); text-transform:uppercase; letter-spacing:.09em; padding:8px 16px;
      border:1px solid var(--blue); background:var(--blue); color:#fff; cursor:pointer; border-radius:3px; }
    .addapp button:hover:not(:disabled) { background:var(--blue-deep); border-color:var(--blue-deep); }
    .addapp button:disabled { opacity:.5; cursor:default; }
    .addmsg { flex-basis:100%; font-size:12px; }

    @media (max-width: 720px) {
      header, nav, main { padding-left:16px; padding-right:16px; }
      main { overflow-x:auto; }
      table { min-width:720px; }
      .cmddesc { flex-basis:100%; margin-left:32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition:none !important; animation:none !important; }
      .cmd button:active:not(:disabled) { transform:none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="mast">
      <div>
        <div class="eyebrow">Personal application ledger</div>
        <h1>Job Tracker</h1>
      </div>
      <div class="mastmeta">
        <div id="today"></div>
        <div>daily run · 8 pm</div>
      </div>
    </div>
    <div id="summary">loading…</div>
  </header>
  <nav id="tabs"></nav>
  <main id="content"></main>

  <script>
    const SECTIONS = [
      { key: "run", label: "Run" },
      { key: "top_picks", label: "Top picks" },
      { key: "all", label: "All" },
      { key: "not_suitable", label: "Not suitable" },
      { key: "applied", label: "Applied" },
      { key: "skills", label: "Skills" },
    ];
    const STAGES = ["not_applied","applied","confirmed","oa","interview","offer","rejected"];
    let active = "top_picks";

    async function j(url, opts) { const r = await fetch(url, opts); return r.json(); }

    async function loadSummary() {
      const s = await j("/api/summary");
      document.getElementById("summary").textContent =
        `${s.total} jobs · ${s.top_picks} top picks · ${s.suitable} suitable · ` +
        `${s.not_suitable} not suitable · ${s.applied} in pipeline · ${s.broken} dead links`;
    }

    function renderTabs() {
      const nav = document.getElementById("tabs");
      nav.innerHTML = "";
      for (const s of SECTIONS) {
        const b = document.createElement("button");
        b.textContent = s.label;
        b.className = s.key === active ? "active" : "";
        b.onclick = () => { active = s.key; renderTabs(); render(); };
        nav.appendChild(b);
      }
    }

    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

    async function setStage(id, stage) {
      await j(`/api/jobs/${encodeURIComponent(id)}/stage`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ stage }),
      });
      loadSummary();
      if (active === "applied" || active === "top_picks") render();
    }

    async function render() {
      const el = document.getElementById("content");
      if (active === "run") return renderRun(el);
      if (active === "skills") return renderSkills(el);
      if (active === "applied") return renderApplied(el);

      const jobs = await j(`/api/jobs?section=${active}`);
      if (!jobs.length) { el.innerHTML = `<div class="empty">Nothing filed under this tab yet.</div>`; return; }
      const rows = jobs.map(job => `
        <tr>
          <td>${job.url ? `<a href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.title)}</a>` : esc(job.title)}
              <div class="muted">${esc(job.location)}</div></td>
          <td>${esc(job.company)}${job.company_blurb ? `<div class="blurb">${esc(job.company_blurb)}</div>` : ""}</td>
          <td>${esc(job.category)}</td>
          <td class="posted">${job.posted_at ? fmtDate(job.posted_at) : "–"}</td>
          <td class="rel">${job.relevance ?? "–"}</td>
          <td><span class="pill ${esc(job.suitability)}">${esc(job.suitability)}</span></td>
          <td class="${esc(job.link_status)}">${esc(job.link_status)}</td>
          <td>${stageSelect(job)}</td>
        </tr>`).join("");
      el.innerHTML = `<table><thead><tr>
        <th>Title</th><th>Company</th><th>Category</th><th>Posted</th><th>Rel</th>
        <th>Suitability</th><th>Link</th><th>Stage</th></tr></thead><tbody>${rows}</tbody></table>`;
      el.querySelectorAll("select[data-id]").forEach(sel =>
        sel.onchange = () => setStage(sel.dataset.id, sel.value));
    }

    function stageSelect(job) {
      const opts = STAGES.map(s => `<option value="${s}" ${s===job.stage?"selected":""}>${s}</option>`).join("");
      return `<select data-id="${esc(job.id)}">${opts}</select>`;
    }

    const STAGE_LABEL = { not_applied:"Not applied", applied:"Applied", confirmed:"Confirmed", oa:"OA", interview:"Interview", offer:"Offer", rejected:"Rejected" };
    const EVENT_LABEL = { applied:"Applied", confirmed:"Confirmed", confirmation:"Confirmed", oa:"OA", interview:"Interview", offer:"Offer", rejected:"Rejected", rejection:"Rejected", other:"Update" };
    function fmtDate(s) {
      const d = new Date(String(s).replace(" ", "T"));
      return isNaN(d) ? esc(s) : d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    }

    async function renderApplied(el) {
      const jobs = await j("/api/applied");
      const addStages = STAGES.filter(s => s !== "not_applied")
        .map(s => `<option value="${s}">${STAGE_LABEL[s]}</option>`).join("");
      const form = `<form class="addapp" id="addApp" title="Log a job you applied to on another site">
        <div class="label">File an application</div>
        <input name="company" placeholder="Company *" />
        <input name="title" placeholder="Role / title" />
        <input name="url" placeholder="Link (optional)" />
        <select name="stage">${addStages}</select>
        <button type="submit">Add application</button>
        <span class="addmsg muted" id="addMsg"></span>
      </form>`;
      const cards = jobs.map(job => {
        // One pill per milestone *label*: 'confirmation' (email) and 'confirmed'
        // (manual) are distinct raw types but the same milestone — keep the earliest.
        const seenLabel = new Set();
        const events = (job.events || []).filter(e => {
          const l = EVENT_LABEL[e.type] || e.type;
          if (seenLabel.has(l)) return false;
          seenLabel.add(l);
          return true;
        });
        const timeline = events.length
          ? events.map(e => `<span class="ev"><b>${esc(EVENT_LABEL[e.type] || e.type)}</b><br><span class="muted">${fmtDate(e.date)}</span></span>`).join('<span class="arrow">→</span>')
          : `<span class="muted">no dated events yet</span>`;
        return `<div class="appcard">
          <div class="apphead">
            <div>${job.url ? `<a href="${esc(job.url)}" target="_blank" rel="noopener">${esc(job.title)}</a>` : esc(job.title)}
              <div class="muted">${esc(job.company)}${job.location ? ` · ${esc(job.location)}` : ""}</div>
              ${job.company_blurb ? `<div class="blurb">${esc(job.company_blurb)}</div>` : ""}</div>
            <span class="pill stage-${esc(job.stage)}">${esc(STAGE_LABEL[job.stage] || job.stage)}</span>
          </div>
          <div class="timeline">${timeline}</div>
          <div class="approw"><span class="muted">Update status:</span> ${stageSelect(job)}</div>
        </div>`;
      }).join("");
      const body = jobs.length ? `<div class="apps">${cards}</div>`
        : `<div class="empty">No applications on file yet. Add one you applied to elsewhere above, or set any job's status to "applied".</div>`;
      el.innerHTML = form + body;
      el.querySelectorAll("select[data-id]").forEach(sel => sel.onchange = () => setStage(sel.dataset.id, sel.value));
      el.querySelector("#addApp").onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target, msg = el.querySelector("#addMsg");
        const company = f.company.value.trim();
        if (!company) { msg.textContent = "Company is required."; return; }
        const btn = f.querySelector("button"); btn.disabled = true;
        msg.textContent = "Adding…";
        try {
          const r = await j("/api/jobs", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ company, title: f.title.value.trim(), url: f.url.value.trim(), stage: f.stage.value }),
          });
          if (r.error) { msg.textContent = r.error; btn.disabled = false; }
          else { loadSummary(); render(); }
        } catch (err) { msg.textContent = String(err.message || err); btn.disabled = false; }
      };
    }

    async function renderSkills(el) {
      const [skills, analysis] = await Promise.all([j("/api/skills"), j("/api/analyses")]);
      let panel = "";
      if (analysis && analysis.content) {
        try {
          const a = JSON.parse(analysis.content);
          const gap = (a.gap || []).map(s => `<span class="pill unreviewed">${esc(s)}</span>`).join(" ");
          panel = `<div class="panel"><div class="label">Analyst summary</div>` +
            `<p>${esc(a.summary || "")}</p>` +
            (gap ? `<div class="label">Skills to learn</div><div>${gap}</div>` : "") + `</div>`;
        } catch {}
      }
      if (!skills.length) { el.innerHTML = panel + `<div class="empty">No skills extracted yet — run Curate first.</div>`; return; }
      const rows = skills.map(s =>
        `<tr><td>${esc(s.skill)}</td><td>${esc(s.category)}</td><td class="rel">${s.count}</td></tr>`).join("");
      el.innerHTML = panel + `<table><thead><tr><th>Skill</th><th>Category</th><th>Jobs</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    let commands = null;

    async function renderRun(el) {
      if (!commands) commands = await j("/api/commands");
      const pipeline = commands.filter(c => c.group === "pipeline");
      const tools = commands.filter(c => c.group !== "pipeline");
      const row = (c, i) => `<div class="cmd">
          <span class="step">${i == null ? "·" : String(i + 1).padStart(2, "0")}</span>
          <button data-cmd="${esc(c.id)}">${esc(c.label)}</button>` +
        (c.takesArg ? `<input data-arg="${esc(c.id)}" placeholder="${c.id === "configure" ? "describe the search…" : "adjust it…"}" />` : "") +
        `<span class="cmddesc">${esc(c.desc || "")}</span>
        </div>`;
      el.innerHTML =
        `<div class="runhead">The whole pipeline runs by itself every day at 8&nbsp;PM and emails the digest — these buttons run any step on demand.</div>` +
        `<div class="cmdgroup"><div class="label">Daily pipeline</div>${pipeline.map((c, i) => row(c, i)).join("")}</div>` +
        `<div class="cmdgroup"><div class="label">Search &amp; tools</div>${tools.map(c => row(c)).join("")}</div>` +
        `<div class="log" id="runlog"><span class="muted">Click a command to run it.</span></div>`;
      const log = el.querySelector("#runlog");
      el.querySelectorAll("button[data-cmd]").forEach(btn => {
        btn.onclick = () => runCommand(el, btn.dataset.cmd, log);
      });
    }

    async function runCommand(el, id, log) {
      const buttons = el.querySelectorAll("button[data-cmd]");
      buttons.forEach(b => b.disabled = true);
      const input = el.querySelector(`input[data-arg="${id}"]`);
      const arg = input ? input.value.trim() : "";
      log.innerHTML = `<span class="muted">Running ${esc(id)}…</span>`;
      try {
        const r = await j("/api/run", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify(arg ? { command: id, arg } : { command: id }),
        });
        if (r.error) {
          log.innerHTML = `<span class="badge fail">✗</span> ${esc(r.error)}`;
        } else {
          const ok = r.exitCode === 0;
          const badge = `<span class="badge ${ok ? "ok" : "fail"}">${ok ? "✓" : "✗"} ${esc(id)} (exit ${r.exitCode})</span>`;
          const err = r.stderr ? `\n\n--- stderr ---\n${esc(r.stderr)}` : "";
          log.innerHTML = `${badge}\n\n${esc(r.stdout) || "(no output)"}${err}`;
          if (ok) { loadSummary(); }  // refresh counts so other tabs show fresh data
        }
      } catch (e) {
        log.innerHTML = `<span class="badge fail">✗</span> ${esc(e.message || e)}`;
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    }

    document.getElementById("today").textContent =
      new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    renderTabs(); render(); loadSummary();
  </script>
</body>
</html>
